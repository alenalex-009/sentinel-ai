services:
  - type: web
    name: sentinel-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-ai-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://sentinel-ai-rho-rosy.vercel.app","https://sentinel-ai-sih.vercel.app","https://sentinel-ai.vercel.app","http://localhost:5173"]'
    healthCheckPath: /health
    plan: free

databases:
  - name: sentinel-ai-db
    plan: free
    databaseName: sentinel_ai
    user: sentinel
