# Sentinel AI — GitLab CI/CD Pipeline
# SIH PS 26191 | Idukki, Kerala

stages:
  - test
  - secret-detection
  - build
  - deploy

# ─── Security scanning ───────────────────────────────────────────────────────────
sast:
  stage: test

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'

secret_detection:
  stage: secret-detection

# ─── Backend model validation test ───────────────────────────────────────────────
test-backend:
  stage: test
  image: python:3.11-slim
  cache:
    key: backend-pip-$CI_COMMIT_REF_SLUG
    paths:
      - backend/.pip-cache/
  script:
    - cd backend
    - pip install --cache-dir .pip-cache fastapi uvicorn pydantic pydantic-settings ortools httpx
    - |
      python -c "
from app.services.risk_engine import compute_risk, compute_vulnerability, compute_rpi
from app.services.risk_validation import validate_munnar_central, validate_site_a_capacity, validate_suitability_site_a

# Validate vulnerability
v = compute_vulnerability(78, 71, 76, 69)
assert abs(v - 73.85) < 0.1, f'Vulnerability mismatch: {v}'
print(f'[PASS] Vulnerability: {v:.2f} (expected ~73.85)')

# Validate risk
r = compute_risk(88, 84, v)
print(f'[PASS] Risk: {r:.2f}')

# Validate full audit
audit = validate_munnar_central()
print(f'[PASS] Risk audit: vuln={audit[\"computed\"][\"vulnerability\"]}, risk={audit[\"computed\"][\"risk\"]}')

# Validate capacity
cap = validate_site_a_capacity()
assert cap['c_safe'] == 3200, f'C_safe mismatch: {cap[\"c_safe\"]}'
assert cap['bottleneck'] == 'water', f'Bottleneck mismatch: {cap[\"bottleneck\"]}'
print(f'[PASS] Capacity: c_safe={cap[\"c_safe\"]}, bottleneck={cap[\"bottleneck\"]}')

# Validate suitability
suit = validate_suitability_site_a()
assert suit['match'], f'Suitability mismatch: computed={suit[\"computed_suitability\"]}, seed={suit[\"seed_suitability\"]}'
print(f'[PASS] Suitability: {suit[\"computed_suitability\"]}')

print('All model validations PASSED')
"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_ID

# ─── Frontend build ───────────────────────────────────────────────────────────
build-frontend:
  stage: build
  image: node:20-alpine
  cache:
    key: frontend-npm-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 2 hours
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_ID

# ─── Deploy frontend to Vercel ────────────────────────────────────────────────
deploy-vercel:
  stage: deploy
  image: node:20-alpine
  needs:
    - build-frontend
  script:
    - npm install -g vercel
    - cd frontend
    - npm ci
    - |
      vercel deploy \
        --token=$VERCEL_TOKEN \
        --prod \
        --yes \
        --build-env VITE_API_URL=${VITE_API_URL:-https://sentinel-ai-backend.onrender.com}
  environment:
    name: production
    url: https://sentinel-ai-sih.vercel.app
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  allow_failure: true

# ─── Trigger Render backend deploy via webhook ─────────────────────────────────
deploy-render:
  stage: deploy
  image: alpine:latest
  needs:
    - test-backend
  script:
    - apk add --no-cache curl
    - |
      if [ -n "$RENDER_DEPLOY_HOOK" ]; then
        curl -s -X POST "$RENDER_DEPLOY_HOOK" && echo "Render deploy triggered"
      else
        echo "RENDER_DEPLOY_HOOK not configured — skipping"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  allow_failure: true
