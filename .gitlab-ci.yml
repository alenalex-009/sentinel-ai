# Sentinel AI — GitLab CI/CD Pipeline
# SIH PS 26191 | Idukki, Kerala

stages:
  - test
  - secret-detection
  - build
  - deploy

# ─── Security scanning ───────────────────────────────────────────────────────────
sast:
  stage: test

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'

secret_detection:
  stage: secret-detection

# ─── Backend model validation test ───────────────────────────────────────────────
# Runs scripts/validate_models.py: engine invariants (vulnerability, risk,
# Munnar audit vs seed, c_safe=3200 bottleneck=water, suitability) must hold
# or the pipeline fails.
test-backend:
  stage: test
  image: python:3.11-slim
  cache:
    key: backend-pip-$CI_COMMIT_REF_SLUG
    paths:
      - backend/.pip-cache/
  script:
    - cd backend
    - pip install --cache-dir .pip-cache pydantic pydantic-settings
    - python scripts/validate_models.py
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_ID

# ─── Frontend E2E smoke tests (Playwright) ───────────────────────────────────────
# Renders every route against the REAL backend: starts FastAPI, lets the
# Playwright webServer config reuse it (plus vite), then runs the suite.
# Catches the class of regression where a page compiles but crashes at render
# time (the redesign once shipped 64 JSX syntax errors that only surfaced
# when a human opened the site).
test-frontend-e2e:
  stage: test
  # Official Playwright image: Chromium + system deps + Node preinstalled.
  # Keep this tag in sync with @playwright/test in frontend/package.json.
  image: mcr.microsoft.com/playwright:v1.63.0-jammy
  # Own cache key: this job runs on Debian (glibc) while build-frontend uses
  # alpine (musl) — sharing node_modules across them breaks esbuild's
  # platform-specific binaries.
  cache:
    key: frontend-npm-e2e-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    # Backend deps (demo endpoints import geopandas/shapely/ortools), then
    # serve on the origin the app's API client defaults to (localhost:8000,
    # already in CORS_ORIGINS). No Postgres in CI — the API degrades to demo
    # mode and /health still answers, which is what the app expects.
    - pip3 install --quiet -r ../backend/requirements.txt || pip3 install --quiet --break-system-packages -r ../backend/requirements.txt
    - (cd ../backend && python3 -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &)
    # Wait for the backend health endpoint (degraded DB is fine; HTTP must
    # answer). python3 is installed above — no curl dependency in this image.
    - |
      python3 - <<'EOF'
      import sys, time, urllib.request
      for attempt in range(1, 31):
          try:
              with urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3) as r:
                  print('Backend healthy (attempt', attempt, ')', r.read().decode())
                  sys.exit(0)
          except Exception as exc:
              if attempt == 30:
                  print('Backend failed to start:', exc)
                  sys.exit(1)
              time.sleep(1)
      EOF
    # Run the suite — its webServer config reuses the running servers.
    - npx playwright test
  artifacts:
    when: on_failure
    paths:
      - frontend/test-results/
      - frontend/playwright-report/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_ID

# ─── Frontend build ───────────────────────────────────────────────────────────
build-frontend:
  stage: build
  image: node:20-alpine
  cache:
    key: frontend-npm-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 2 hours
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_ID

# ─── Deploy frontend to Vercel ────────────────────────────────────────────────
deploy-vercel:
  stage: deploy
  image: node:20-alpine
  needs:
    - build-frontend
  # Runs from the REPO ROOT (never `cd frontend`): the root vercel.json holds
  # the SPA rewrites + /api→Render proxy. Deploying from frontend/ would skip
  # it and ship a broken build. VERCEL_ORG_ID/VERCEL_PROJECT_ID must be set
  # as CI variables (Project Settings → CI/CD → Variables) to target the
  # existing project that serves sentinel-ai-rho-rosy.vercel.app.
  script:
    - npm install -g vercel
    - |
      vercel deploy \
        --token=$VERCEL_TOKEN \
        --prod \
        --yes \
        --cwd "$CI_PROJECT_DIR"
  environment:
    name: production
    url: https://sentinel-ai-rho-rosy.vercel.app
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  allow_failure: true

# ─── Trigger Render backend deploy via webhook ─────────────────────────────────
deploy-render:
  stage: deploy
  image: alpine:latest
  needs:
    - test-backend
  script:
    - apk add --no-cache curl
    - |
      if [ -n "$RENDER_DEPLOY_HOOK" ]; then
        curl -s -X POST "$RENDER_DEPLOY_HOOK" && echo "Render deploy triggered"
      else
        echo "RENDER_DEPLOY_HOOK not configured — skipping"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  allow_failure: true
