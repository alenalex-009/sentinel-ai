version: '3.9'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: sentinel_db
    environment:
      POSTGRES_DB: sentinel_ai
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentinel -d sentinel_ai']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Routing (Phase 5, region-aware datasets) ────────────────────────────────
  # One GraphHopper engine per routing region (graphs are built at import time
  # and must not be hot-swapped). Each service imports its own OSM extract
  # (bind-mounted read-only, gitignored) into its own persistent cache volume.
  # All three services share graphhopper/config.yml: every extract is mounted
  # at the same in-container path /data/region.osm, and caches are per-service
  # named volumes, so each engine always imports its own region's dataset.
  graphhopper-kerala:
    build:
      context: ./graphhopper
      dockerfile: Dockerfile
    container_name: sentinel_graphhopper
    ports:
      - '8989:8989'
    volumes:
      - ./osm/kerala.osm:/data/region.osm:ro
      - ./graphhopper/config.yml:/gh/config.yml:ro
      - ghdata_kerala:/data/cache
    restart: unless-stopped

  graphhopper-vizag:
    build:
      context: ./graphhopper
      dockerfile: Dockerfile
    container_name: sentinel_graphhopper_vizag
    ports:
      - '8991:8989'
    volumes:
      - ./osm/vizag.osm:/data/region.osm:ro
      - ./graphhopper/config.yml:/gh/config.yml:ro
      - ghdata_vizag:/data/cache
    restart: unless-stopped

  graphhopper-assam:
    build:
      context: ./graphhopper
      dockerfile: Dockerfile
    container_name: sentinel_graphhopper_assam
    ports:
      - '8992:8989'
    volumes:
      - ./osm/assam.osm:/data/region.osm:ro
      - ./graphhopper/config.yml:/gh/config.yml:ro
      - ghdata_assam:/data/cache
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_backend
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel_dev@db:5432/sentinel_ai
      DEMO_MODE: 'true'
      GRAPHHOPPER_KERALA_URL: http://graphhopper-kerala:8989
      GRAPHHOPPER_VIZAG_URL: http://graphhopper-vizag:8989
      GRAPHHOPPER_ASSAM_URL: http://graphhopper-assam:8989
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - '5173:5173'
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  ghdata_kerala:
  ghdata_vizag:
  ghdata_assam:
