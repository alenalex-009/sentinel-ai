version: '3.9'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: sentinel_db
    environment:
      POSTGRES_DB: sentinel_ai
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentinel -d sentinel_ai']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Routing (Phase 5, region-aware datasets) ────────────────────────────────
  # One GraphHopper engine per routing region.
  # Each service imports its own OSM extract into its own persistent cache.

  graphhopper-kerala:
    build:
      context: ./graphhopper
      dockerfile: Dockerfile
    container_name: sentinel_graphhopper
    ports:
      - '8990:8989'
    volumes:
      - ./osm/kerala.osm:/data/region.osm:ro
      - ./graphhopper/config.yml:/gh/config.yml:ro
      - ghdata_kerala:/data/cache
    restart: unless-stopped

  graphhopper-vizag:
    build:
      context: ./graphhopper
      dockerfile: Dockerfile
    container_name: sentinel_graphhopper_vizag
    ports:
      - '8991:8989'
    volumes:
      - ./osm/vizag.osm:/data/region.osm:ro
      - ./graphhopper/config.yml:/gh/config.yml:ro
      - ghdata_vizag:/data/cache
    restart: unless-stopped

  graphhopper-assam:
    build:
      context: ./graphhopper
      dockerfile: Dockerfile
    container_name: sentinel_graphhopper_assam
    ports:
      - '8992:8989'
    volumes:
      - ./osm/assam.osm:/data/region.osm:ro
      - ./graphhopper/config.yml:/gh/config.yml:ro
      - ghdata_assam:/data/cache
    restart: unless-stopped

  # ── Multi-engine routing ─────────────────────────────────────────────────────
  # OSRM and Valhalla use the same Kerala OSM extract after conversion to PBF.

  osm-convert:
    build:
      context: ./docker/osmium-converter
      dockerfile: Dockerfile
    container_name: sentinel_osm_convert
    volumes:
      - ./osm:/data/osm:ro
      - osrpbf:/data/pbf
    restart: "no"

  osrm-prep:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: sentinel_osrm_prep
    volumes:
      - osrpbf:/data
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "osrm-extract -p /opt/car.lua /data/kerala.osm.pbf &&
       osrm-partition /data/kerala.osm.pbf &&
       osrm-customize /data/kerala.osm.pbf &&
       echo OSRM preprocessing done"
    depends_on:
      osm-convert:
        condition: service_completed_successfully
    restart: "no"

  osrm-kerala:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: sentinel_osrm
    ports:
      - '5000:5000'
    volumes:
      - osrpbf:/data:ro
    command: osrm-routed --algorithm mld /data/kerala.osm.pbf
    depends_on:
      osrm-prep:
        condition: service_completed_successfully
    restart: unless-stopped

  valhalla-kerala:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: sentinel_valhalla
    ports:
      - '8002:8002'
    environment:
      server_threads: '2'
      tileset_name: kerala
      use_tiles_ignore_pbf: 'False'
      force_rebuild: 'False'
    volumes:
      - osrpbf:/custom_files
      - valhalla_tiles:/data/valhalla
    depends_on:
      osm-convert:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Backend ──────────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_backend
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel_dev@db:5432/sentinel_ai
      DEMO_MODE: 'true'

      # IMPORTANT:
      # This stays on internal Docker port 8989.
      # Host port is 8990.
      GRAPHHOPPER_KERALA_URL: http://graphhopper-kerala:8989

      GRAPHHOPPER_VIZAG_URL: http://graphhopper-vizag:8989
      GRAPHHOPPER_ASSAM_URL: http://graphhopper-assam:8989

      OSRM_KERALA_URL: http://osrm-kerala:5000
      VALHALLA_KERALA_URL: http://valhalla-kerala:8002

    ports:
      - '8000:8000'

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./backend:/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel_frontend
    environment:
      VITE_API_URL: http://localhost:8000

    ports:
      - '5173:5173'

    depends_on:
      - backend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    command: npm run dev -- --host 0.0.0.0


# ── Persistent volumes ─────────────────────────────────────────────────────────

volumes:
  pgdata:
  ghdata_kerala:
  ghdata_vizag:
  ghdata_assam:
  osrpbf:
  valhalla_tiles: